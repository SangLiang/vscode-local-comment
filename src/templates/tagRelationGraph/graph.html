<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src ${cspSource} 'unsafe-inline'; img-src ${cspSource} https: http: data:;">
    <title>${title}</title>
    <link rel="stylesheet" href="${cssUri}">
</head>
<body>
    <div class="header">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="actions">
            <button id="btn-back" class="btn" disabled>返回</button>
            <button id="btn-reset" class="btn">重置</button>
        </div>
    </div>
    
    <div class="toolbar">
        <button id="btn-refresh" class="btn">刷新</button>
        <span id="status" class="status"></span>
    </div>
    
    <div class="legend">
        <span class="legend-item"><span class="legend-dot center"></span> 当前节点</span>
        <span class="legend-item"><span class="legend-dot children"></span> 可展开</span>
        <span class="legend-item"><span class="legend-dot leaf"></span> 叶子节点</span>
    </div>
    
    <div id="graph-container" class="graph-container"></div>
    
    <script src="${cytoscapeUri}"></script>
    <script src="${jsUri}"></script>
    <script>
        const vscode = acquireVsCodeApi();
        window.TagRelationGraphView.init({
            vscode: vscode,
            container: document.getElementById('graph-container'),
            chrome: {
                breadcrumb: document.getElementById('breadcrumb'),
                btnBack: document.getElementById('btn-back'),
                btnReset: document.getElementById('btn-reset'),
                btnRefresh: document.getElementById('btn-refresh'),
                status: document.getElementById('status')
            },
            skipCenterJump: false
        });
        window.addEventListener('message', (event) => {
            const message = event.data;
            if (message.command === 'updateGraph') {
                window.TagRelationGraphView.render(message.data);
            } else if (message.command === 'showError') {
                window.TagRelationGraphView.showError(message.error);
            }
        });
    </script>
</body>
</html>
